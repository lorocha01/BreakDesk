name: desktop

on:
  push:
    branches: [main]
    paths: ["core/**", "desktop/**", "Cargo.toml", "Cargo.lock", ".github/workflows/desktop-build.yml"]
  pull_request:
    paths: ["core/**", "desktop/**", "Cargo.toml", "Cargo.lock", ".github/workflows/desktop-build.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: core tests + clippy (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libegl1-mesa-dev libgbm-dev clang cmake nasm xvfb
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: |
          mkdir -p desktop/dist && [ -f desktop/dist/index.html ] || echo '<!doctype html>' > desktop/dist/index.html
          cargo clippy -p nexo-core --features hostd --all-targets -- -D warnings
          cargo clippy -p nexo-desktop -- -D warnings
      - name: unit + integration tests (with a virtual display for real capture/H.264)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo test -p nexo-core --features hostd
      - name: capture/encode self-test
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo run -p nexo-core --features hostd --bin nexo-hostd -- --selftest 30

  windows:
    name: Windows installer (NSIS + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Core tests (Windows input/capture code paths)
        run: cargo test -p nexo-core
      - name: Build installers
        working-directory: desktop
        env:
          VITE_NEXO_SERVER: ${{ vars.NEXO_SERVER_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build
      - name: Build headless agent
        run: cargo build --release -p nexo-core --features hostd --bin nexo-hostd
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/nexo-hostd.exe
          if-no-files-found: error
